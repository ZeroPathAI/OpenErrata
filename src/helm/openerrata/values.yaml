replicaCount:
  api: 2
  worker: 2

# CI publishes `<env>-<git sha>` (immutable) and `<env>-latest` (moved after a
# successful deploy) tags, e.g. `main-latest`. There is no default version:
# set image.tag or image.digest.
image:
  repository: ghcr.io/zeropathai/openerrata-api
  tag: ""
  # Optional immutable digest (sha256:...). When set, it takes precedence over tag.
  digest: ""
  pullPolicy: Always

migration:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300

frontend:
  enabled: false
  replicaCount: 1
  # Required when frontend.enabled=true: the backend API origin used for SSR
  # GraphQL requests (e.g. "https://api.openerrata.com" or a cluster-internal URL).
  apiBaseUrl: ""
  image:
    repository: ghcr.io/zeropathai/openerrata-frontend
    # Required when frontend.enabled=true unless digest is set (see image.tag).
    tag: ""
    digest: ""
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3001
    skipAwait: false
  ingress:
    enabled: false
    className: nginx
    host: ""
    path: /
    pathType: Prefix
    annotations: {}
    tls:
      enabled: false
      secretName: ""

serviceAccount:
  create: true
  names:
    api: ""
    worker: ""
    selector: ""
    migrate: ""
    frontend: ""

# Applied to every pod. Both images run as their `node` user (uid/gid 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Container resource requests/limits per component. Empty means the cluster's
# defaults (LimitRange) apply; size these from observed usage.
resources:
  api: {}
  worker: {}
  selector: {}
  migrate: {}
  frontend: {}

networkPolicy:
  enabled: true
  # The worker fetches URLs chosen by the LLM and by post content. When enabled,
  # its egress is limited to DNS and public addresses, which blocks the cloud
  # metadata endpoint and in-cluster services. Private destinations the worker
  # needs (e.g. an in-cluster or VPC-internal database) go in allowedCidrs.
  # Off by default because the database address is deployment-specific.
  workerEgress:
    enabled: false
    allowedCidrs: []

service:
  type: ClusterIP
  port: 3000
  # Keep await enabled by default so service creation failures are surfaced
  # during deploys. Set true only when diagnosing Pulumi await deadlocks.
  skipAwait: false

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""

selector:
  schedule: "*/5 * * * *"
  # Maximum investigations the selector admits per UTC day, however often the
  # schedule runs it.
  dailyBudget: "100"

config:
  # How the API learns each viewer's IP address (SvelteKit adapter-node
  # ADDRESS_HEADER / XFF_DEPTH). The defaults match the chart's nginx ingress,
  # which sets X-Forwarded-For to the address it accepted the connection from,
  # so the client is the last entry. If another proxy (e.g. Cloudflare) sits in
  # front of the ingress controller, configure the controller's real-IP
  # handling (use-forwarded-headers / proxy-real-ip-cidr) so that address is
  # the viewer's, or every viewer counts against one IP range. The API refuses
  # to start in production without these.
  clientAddressHeader: "x-forwarded-for"
  clientAddressXffDepth: "1"
  ipRangeCreditCap: "10"
  workerConcurrency: "250"
  openaiMaxResponseToolRounds: "150"
  databaseEncryptionKeyId: "primary"
  # Required: blob storage backend provider ("aws" or "s3_compatible").
  blobStorageProvider: ""
  # Required: blob storage region. Use an AWS region (for "aws") or provider
  # specific value for "s3_compatible". Pulumi infers "auto" only for
  # Cloudflare R2 endpoints; other s3-compatible providers should set this
  # explicitly.
  blobStorageRegion: ""
  # Optional endpoint for "s3_compatible" providers. Must be empty for "aws".
  blobStorageEndpoint: ""
  # Required: name of the S3/R2 bucket used for investigation image blobs.
  blobStorageBucket: ""

# Secrets must be provided via --set or external secret manager
secrets:
  # Optional: use a pre-created Kubernetes Secret instead of rendering one in this chart.
  existingSecretName: ""
  # Required: Postgres connection string.
  databaseUrl: ""
  # Required: server-side OpenAI key used by worker and selector investigations.
  openaiApiKey: ""
  # Required: symmetric key used to encrypt transient DB-stored secrets.
  databaseEncryptionKey: ""
  # Required: credentials for blob storage uploads.
  blobStorageAccessKeyId: ""
  blobStorageSecretAccessKey: ""
