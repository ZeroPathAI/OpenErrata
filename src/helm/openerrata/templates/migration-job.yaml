{{/*
Helm runs this as a hook before every upgrade and after the first install
(the chart Secret it reads does not exist before then). Pulumi's Helm support
ignores hooks and creates the Job alongside the workloads; either way the
workloads' wait-for-migrations init container keeps new pods off an
unmigrated schema.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openerrata.fullname" . }}-migrate
  labels:
    {{- include "openerrata.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "openerrata.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "openerrata.serviceAccountName" (dict "root" . "component" "migrate") }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "openerrata.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          env:
            {{- include "openerrata.databaseUrlEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.migrate | nindent 12 }}
